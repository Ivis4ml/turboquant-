[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vqbench"
version = "0.1.0"
description = "Unified Vector Quantization Benchmark: TurboQuant, RaBitQ, PQ under one API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-timeout>=2.2"]
# Real-model validation: required to run `python -m vqbench.validation.run_quick`
validation = [
    "torch>=2.4",
    "transformers>=5.5.0",
    "datasets>=3.0",
    "tokenizers>=0.20",
    "safetensors>=0.4",
]
notebook = ["matplotlib>=3.8", "jupyter>=1.0"]
# Everything
all = [
    "vqbench[test,validation,notebook]",
]

[tool.setuptools.packages.find]
include = ["vqbench*"]

[tool.pytest.ini_options]
testpaths = ["vqbench/tests"]
addopts = "-v --tb=short"
